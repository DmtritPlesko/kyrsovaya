<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>User</h1>
    <table>
        <tr>
            <th>Name</th>
        </tr>
        <tr th:each="user : ${user}">
            <td><span th:text = "${user.name}"></span></td>
        </tr>
    </table>
</body>
</html>
