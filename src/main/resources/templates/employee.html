<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees</title>
</head>
<body>
<h1>Employees</h1>
<table>
    <tr>
        <th>Name</th>
    </tr>
    <tr th:each="employee : ${employee}">
        <td><span th:text = "${employee.name}"></span></td>
    </tr>
</table>
</body>
</html>
