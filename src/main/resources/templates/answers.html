<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answers</title>
</head>
<body>
<h1>Answers</h1>
<table>
    <tr>
        <th>Description</th>
    </tr>
    <tr th:each="answer : ${answers}">
        <td><span th:text = "${answer.description}"></span></td>
    </tr>
</table>
</body>
</html>
